name: Feature request
description: Suggest an improvement or a new skill
labels: ["type: feature"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill is this for, or "new skill"?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution

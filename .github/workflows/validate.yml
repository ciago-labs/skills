name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          for d in skills/*/; do
            dir_name=$(basename "$d")
            f="${d}SKILL.md"
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
            [ "$(head -n 1 "$f")" = "---" ] || { echo "::error::$f must start with ---"; exit 1; }
            fm=$(sed -n '2,/^---$/p' "$f")
            name=$(echo "$fm" | grep -m1 '^name:' | sed 's/^name:[[:space:]]*//')
            echo "$fm" | grep -q '^description:' || { echo "::error::$f missing description"; exit 1; }
            [ "$name" = "$dir_name" ] || { echo "::error::name '$name' != folder '$dir_name'"; exit 1; }
            echo "OK: $dir_name"
          done

      - name: Validate JSON files
        run: |
          set -e
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          find skills -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool > /dev/null
          echo "All JSON files valid"

      - name: Check shell script syntax
        run: |
          set -e
          find skills -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          echo "Shell syntax OK"

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile all Python scripts
        run: python3 -m compileall -q skills

      - name: Run skill tests
        run: |
          set -e
          for d in skills/*/; do
            if [ -d "${d}tests" ]; then
              echo "Testing $d"
              (cd "$d" && python3 -m unittest discover -s tests -v)
            fi
          done
